<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://*.supabase.co; connect-src https://*.supabase.co; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C1B19">
<meta name="referrer" content="no-referrer">
<title>Pelacak Inventaris · Royal Tulip Springhill Resort Jimbaran</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css?v=8688a92c">
</head>
<body>
<noscript><p class="noscript">Aplikasi ini membutuhkan JavaScript.</p></noscript>

<!-- ============ LAYAR MASUK ============ -->
<main id="v-login" class="login" hidden>
  <section class="login-card">
    <header class="hero">
      <img src="emblem.svg" alt="Royal Tulip" class="hero-emblem">
      <img src="wordmark.svg" alt="" class="hero-word">
      <p class="hero-title">PELACAK INVENTARIS</p>
      <span class="hero-rule"></span>
      <p class="hero-sub">ROYAL TULIP SPRINGHILL RESORT &amp; VILLAS · JIMBARAN</p>
    </header>
    <form id="f-login" class="stack" autocomplete="on">
      <h1 id="login-h">Masuk</h1>
      <label>Email<input name="email" type="email" required autocomplete="username" maxlength="200"></label>
      <label>Kata sandi<input name="password" type="password" required minlength="8" autocomplete="current-password" maxlength="200"></label>
      <label class="check"><input name="remember" type="checkbox" checked> Ingat saya di perangkat ini</label>
      <p id="login-msg" class="msg" role="alert"></p>
      <button class="btn primary" type="submit" id="b-login">MASUK</button>
      <button class="btn link" type="button" id="b-toggle">Belum punya akun? Daftar</button>
      <div class="or"><span>atau</span></div>
      <button class="btn outline google" type="button" id="b-google">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        MASUK DENGAN GOOGLE</button>
      <p class="hint">Tanpa kata sandi. Akun dibuat otomatis saat pertama masuk.</p>
    </form>
    <footer class="login-foot"><a href="../privasi.html">Kebijakan privasi</a> · <a href="../hapus-akun.html">Hapus akun</a></footer>
  </section>
</main>

<!-- ============ APLIKASI ============ -->
<div id="v-app" hidden>
  <header class="bar">
    <div class="bar-brand">
      <img src="emblem.svg" alt="Royal Tulip" class="bar-emblem">
      <div><div class="bar-title">Inventaris</div><div class="bar-sub" id="who"></div></div>
    </div>
    <nav class="bar-actions">
      <button class="icon" id="b-refresh" title="Segarkan" aria-label="Segarkan"><svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>
      <div class="menu-wrap">
        <button class="icon" id="b-menu" title="Menu" aria-label="Menu" aria-haspopup="true"><svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg></button>
        <div class="menu" id="menu" hidden>
          <button data-act="people">Personel</button>
          <button data-act="csv">Unduh CSV (tampilan ini)</button>
          <button data-act="audit-mode" id="m-audit">Mode audit (pindai = audit)</button>
          <a href="../privasi.html" target="_blank" rel="noopener">Kebijakan privasi</a>
          <button data-act="logout">Keluar</button>
        </div>
      </div>
    </nav>
  </header>

  <main class="wrap">
    <div id="progress" class="progress" hidden></div>
    <section class="kpis" id="kpis"></section>
    <section class="tools">
      <input id="q" type="search" placeholder="Cari nama, kode, lokasi, atau pemegang" maxlength="120" autocomplete="off">
      <select id="f-cat" aria-label="Kategori"></select>
      <select id="f-status" aria-label="Status"></select>
    </section>
    <section class="chips" id="chips" role="tablist"></section>
    <p id="truncated" class="note" hidden>Menampilkan 20.000 aset pertama.</p>
    <section id="list" class="list" aria-live="polite"></section>
    <p id="empty" class="empty" hidden></p>
    <div class="more" id="more-wrap" hidden><button class="btn outline" id="b-more">Tampilkan lebih banyak</button></div>
  </main>

  <div class="fabs">
    <button class="fab small" id="b-add" title="Tambah aset" aria-label="Tambah aset"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
    <button class="fab" id="b-scan"><svg viewBox="0 0 24 24"><path d="M3 5a2 2 0 0 1 2-2h3v2H5v3H3V5zm13-2h3a2 2 0 0 1 2 2v3h-2V5h-3V3zM3 16h2v3h3v2H5a2 2 0 0 1-2-2v-3zm16 0h2v3a2 2 0 0 1-2 2h-3v-2h3v-3zM7 7h2v10H7V7zm3 0h1v10h-1V7zm2 0h2v10h-2V7zm3 0h1v10h-1V7zm2 0h1v10h-1V7z"/></svg><span id="scan-label">Pindai / cari kode</span></button>
  </div>
</div>

<dialog id="dlg" aria-modal="true"><div id="dlg-body"></div></dialog>

<!-- Konfirmasi dalam aplikasi: dialog bawaan browser memblokir halaman dan tidak bisa digayakan. -->
<dialog id="ask" aria-modal="true">
  <div class="dlg-h"><h2 id="ask-t"></h2></div>
  <div class="dlg-c"><p id="ask-x" class="note"></p></div>
  <div class="dlg-f">
    <button class="btn link" id="ask-no">Batal</button>
    <button class="btn primary" id="ask-yes">Ya</button>
  </div>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="app.js?v=9d7cbb16"></script>
</body>
</html>
